<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the same mark as the sidebar logo (AppShell), scaled up.
       Meta requires 1024x1024 with no transparency. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4361ee"/>
      <stop offset="1" stop-color="#805dca"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Nudged off the geometric centre: the glyph carries its own side bearing,
       so x/y 512 renders visibly low and to the right. -->
  <text x="487" y="474" fill="#ffffff"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="620" font-weight="800"
        text-anchor="middle" dominant-baseline="central">P</text>
</svg>
